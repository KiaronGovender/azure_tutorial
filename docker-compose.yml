name: azure-tutorial

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: azure-tutorial-app:latest
    container_name: azure_tutorial_app
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8000}:80'
    environment:
      APP_NAME: '${APP_NAME:-Laravel}'
      APP_ENV: '${APP_ENV:-production}'
      APP_KEY: '${APP_KEY:-base64:pa8M5gbH0ldK+5aQPIOwVpqxNLp7+mY2LSVp37d+eRA=}'
      APP_DEBUG: '${APP_DEBUG:-true}'
      APP_URL: '${APP_URL:-http://localhost:8000}'
      DB_CONNECTION: 'mysql'
      DB_HOST: 'mysql'
      DB_PORT: '3306'
      DB_DATABASE: '${DB_DATABASE:-azure_tutorial}'
      DB_USERNAME: '${DB_USERNAME:-laravel}'
      DB_PASSWORD: '${DB_PASSWORD:-secret}'
      QUEUE_CONNECTION: 'redis'
      CACHE_STORE: 'redis'
      SESSION_DRIVER: 'redis'
      REDIS_HOST: 'redis'
      REDIS_PORT: '6379'
      MAIL_MAILER: '${MAIL_MAILER:-smtp}'
      MAIL_HOST: 'mailpit'
      MAIL_PORT: '1025'
      RUN_MIGRATIONS: 'true'
      RUN_QUEUE_WORKER: 'false'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: azure-tutorial-app:latest
    container_name: azure_tutorial_queue
    restart: unless-stopped
    environment:
      APP_NAME: '${APP_NAME:-Laravel}'
      APP_ENV: '${APP_ENV:-production}'
      APP_KEY: '${APP_KEY:-base64:pa8M5gbH0ldK+5aQPIOwVpqxNLp7+mY2LSVp37d+eRA=}'
      APP_DEBUG: '${APP_DEBUG:-false}'
      DB_CONNECTION: 'mysql'
      DB_HOST: 'mysql'
      DB_PORT: '3306'
      DB_DATABASE: '${DB_DATABASE:-azure_tutorial}'
      DB_USERNAME: '${DB_USERNAME:-laravel}'
      DB_PASSWORD: '${DB_PASSWORD:-secret}'
      QUEUE_CONNECTION: 'redis'
      CACHE_STORE: 'redis'
      REDIS_HOST: 'redis'
      REDIS_PORT: '6379'
      CONTAINER_ROLE: 'queue'
      RUN_MIGRATIONS: 'false'
      RUN_QUEUE_WORKER: 'true'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: azure_tutorial_mysql
    restart: unless-stopped
    ports:
      - '${FORWARD_DB_PORT:-33061}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
      MYSQL_DATABASE: '${DB_DATABASE:-azure_tutorial}'
      MYSQL_USER: '${DB_USERNAME:-laravel}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-u',
          'root',
          '-p${DB_PASSWORD:-secret}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: azure_tutorial_redis
    restart: unless-stopped
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: azure_tutorial_mailpit
    restart: unless-stopped
    ports:
      - '${FORWARD_MAILPIT_PORT:-8025}:8025'
      - '${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025'

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
