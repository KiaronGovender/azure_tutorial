name: azure-tutorial-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azure_tutorial_dev_app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    environment:
      APP_ENV: "local"
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: "mysql"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_DATABASE: "azure_tutorial"
      DB_USERNAME: "laravel"
      DB_PASSWORD: "secret"
      QUEUE_CONNECTION: "redis"
      CACHE_STORE: "redis"
      REDIS_HOST: "redis"
      RUN_MIGRATIONS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  vite:
    image: node:22-alpine
    container_name: azure_tutorial_dev_vite
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  mysql:
    image: mysql:8.4
    container_name: azure_tutorial_dev_mysql
    ports:
      - "33061:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "secret"
      MYSQL_DATABASE: "azure_tutorial"
      MYSQL_USER: "laravel"
      MYSQL_PASSWORD: "secret"
    volumes:
      - dev-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: azure_tutorial_dev_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dev-mysql-data:
    driver: local
